version: 1
name: Artsonia
slug: artsonia
summary: >-
  Artsonia student-art portfolios, comments, and fans for Claude — access
  via natural language
#
# Hosting note (a comment, not user-facing summary text): this is a
# BROWSER-BRIDGE MCP — it reaches its site through the user's signed-in
# tab via the fetchproxy bridge. A bridged registration also needs runtime
# `fly-shared`, `bridge: true` and a `bridgePortEnv`, which are registration
# fields this manifest has no schema for (set them over the control API).
# `state.dataDir` below is required for `bridge`.
env:
  - name: ARTSONIA_USERNAME
    required: true
    help: >-
      Your Artsonia login email address
  - name: ARTSONIA_PASSWORD
    secret: true
    required: true
    help: >-
      Your Artsonia account password
  - name: ARTSONIA_INLINE_DOWNLOADS
    required: false
    help: >-
      Set to 1 to return downloaded artwork as inline MCP image content instead
      of writing files to disk. Recommended when hosted: the server's filesystem
      is not the user's, so a written path would be unreachable.
  - name: ARTSONIA_TRANSPORT
    required: false
    help: >-
      Selects the transport used to reach the site (e.g. the fetchproxy bridge
      vs a direct fetch). Leave unset for the default.
  - name: ARTSONIA_WS_PORT
    required: false
    help: >-
      Concentrator port for the fetchproxy browser bridge (defaults to the
      fleet-shared 37149). The runner injects a per-registration port for a
      hosted bridged child, so this is the name to give bridgePortEnv at
      registration.
  - name: ARTSONIA_SESSION_CACHE
    required: false
    help: >-
      Set to false to disable the on-disk session cache and log in on every
      process start. Defaults to enabled (direct transport only).
  - name: ARTSONIA_SESSION_FILE
    required: false
    help: >-
      Absolute path for the session cache file. Defaults to
      $MCP_DATA_DIR/.artsonia-mcp/session.json.
state:
  dataDir: true
  reason: >-
    Two things live here. The fetchproxy identity is at
    $HOME/.fetchproxy/identity/<name>.json and the pair code derives from it —
    without a persistent $HOME every cold start mints a fresh identity and
    re-prompts pairing in the browser, and the API refuses bridge without it.
    On the direct transport the signed-in session is also cached at
    $MCP_DATA_DIR/.artsonia-mcp/session.json (0600), so a restart reuses the
    cookie jar instead of re-running the form login; a hosted child idles out
    after ten minutes, so that is most starts.
egress:
  allow:
    # Only hosts the SERVER process actually fetches. Hosts that appear
    # solely in a URL this server BUILDS and returns are excluded.
    # Matching is exact: an apex entry does not cover subdomains and the
    # proxy follows no redirects, so every hop is its own dial.
    # Artwork downloads fetch this CDN directly in BOTH transports
    # (tools/download.ts HEADs and GETs the URL built by artworkImageUrl(),
    # bypassing the site transport).
    - images.artsonia.com
    # The DEFAULT transport (ARTSONIA_TRANSPORT unset / `fetch`) dials the
    # site itself: every ArtsoniaRequest path resolves against
    # https://www.artsonia.com (transport.ts ARTSONIA_ORIGIN), and the
    # login.asp 302 lands on a same-host path (/members/), not another host.
    # Under ARTSONIA_TRANSPORT=fetchproxy the signed-in browser tab dials the
    # site instead and the process opens only the loopback concentrator port,
    # so this entry is unused there but harmless. The bare apex
    # `artsonia.com` is never dialled (it 307s TO www, never the reverse).
    - www.artsonia.com
